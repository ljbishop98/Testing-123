# Admin panel (Decap CMS). Kim signs in at yoursite.com/admin with her email + password (Netlify Identity).
# Every save commits to GitHub and Netlify republishes the site in about a minute.
backend:
  name: git-gateway
  branch: main

publish_mode: simple
site_url: /
display_url: /
logo_url: /assets/admin-logo.svg

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: galleries
    label: Galleries
    label_singular: Gallery
    description: "Each gallery is an album on the Work page. Click 'New Gallery' to add one."
    folder: "src/galleries"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} — {{category}} ({{year}})"
    sortable_fields: ["date", "title", "category"]
    view_groups:
      - label: Category
        field: category
    fields:
      - { label: "Gallery title", name: title, widget: string }
      - label: Category
        name: category
        widget: select
        options: ["Weddings", "Graduations", "Concerts", "Conferences", "Lifestyle", "Sports", "Real Estate", "BTS & Stills"]
      - { label: "Shoot date", name: date, widget: datetime, time_format: false, date_format: "MMM D, YYYY", format: "YYYY-MM-DD" }
      - { label: "Location (optional)", name: location, widget: string, required: false }
      - { label: "Short description", name: description, widget: string, required: false, hint: "One line shown under the title." }
      - { label: "Cover photo", name: cover, widget: image, hint: "Shown on the Work page and home page." }
      - label: Photos
        name: photos
        widget: image
        multiple: true
        hint: "Select or drag in several photos at once. Drag to reorder. Export for web first (about 2000px on the long edge)."
      - { label: "Sort order", name: order, widget: number, default: 50, value_type: int, hint: "Lower numbers show first on the Work page." }

  - name: pages
    label: Home page
    editor: { preview: false }
    files:
      - name: site
        label: "Cover, contact & HoneyBook"
        file: "src/_data/site.json"
        fields:
          - { label: "Business name", name: name, widget: string }
          - { label: "Your name", name: owner, widget: string }
          - { label: "Top-left line", name: strap, widget: string, hint: "e.g. Photography & Creative Direction · Dallas, Texas" }
          - { label: "Title under your name", name: role, widget: string }
          - { label: "Cover photo", name: portrait, widget: image }
          - { label: "Cover photo description", name: portrait_alt, widget: string, hint: "Describes the photo for screen readers." }
          - { label: "Intro paragraph", name: statement, widget: text }
          - { label: "Contact heading", name: contact_heading, widget: string, hint: "Put *stars* around a word to make it italic." }
          - { label: "Contact text", name: contact_text, widget: text }
          - { label: "HoneyBook form link", name: honeybook_link, widget: string, required: false, hint: "In HoneyBook: open your contact form → Publish → copy the direct link. Every Inquire button goes here." }
          - label: "HoneyBook embed code (optional)"
            name: honeybook_embed
            widget: code
            default_language: html
            output_code_only: true
            required: false
            hint: "To show the form on the page itself: HoneyBook → Publish → Copy code, then paste here."
          - { label: "Email", name: email, widget: string, required: false }
          - { label: "Instagram handle (no @)", name: instagram, widget: string, required: false }

      - name: home
        label: "How your day will look"
        file: "src/_data/home.json"
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: "Small label", name: label, widget: string }
          - label: Chapters
            name: chapters
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: "Small label", name: label, widget: string }
              - label: Photos
                name: photos
                widget: list
                summary: "{{fields.caption}}"
                hint: "4, 5 or 6 photos fill the layout best."
                fields:
                  - { label: Photo, name: image, widget: image }
                  - { label: "Caption (optional)", name: caption, widget: string, required: false }

      - name: pricing
        label: "Starting prices"
        file: "src/_data/pricing.json"
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: "Small label", name: label, widget: string }
          - label: "Price rows"
            name: rows
            widget: list
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: "Starting price", name: price, widget: string }
              - { label: "Unit (optional)", name: unit, widget: string, required: false, hint: "e.g. / hour" }
              - { label: "Button text", name: button, widget: string }
              - { label: "Solid button", name: primary, widget: boolean, required: false }
          - label: "Inquiry cards"
            name: cards
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Small label", name: label, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Tags, name: tags, widget: list, required: false }

      - name: films
        label: Films
        file: "src/_data/films.json"
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: "Small label", name: label, widget: string }
          - label: Films
            name: films
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: "Small label", name: label, widget: string }
              - { label: "Video link (Vimeo or YouTube)", name: url, widget: string, required: false }
              - { label: "Thumbnail", name: thumbnail, widget: image, required: false }
